<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><script defer="defer" src="main.js"></script></head><body><dialog id="new-todo-dialog"><form action="" method="dialog"><div><label for="title">Title:</label> <input id="title" placeholder="Title" autofocus></div><div><label for="group">Project:</label> <select name="group" id="group"></select> <button type="button" id="add-project">Add Project</button></div><div><label for="date">Due date:</label> <input type="date" id="date"></div><div><label for="priority">Priority:</label> <select name="priority" id="priority"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div><label for="desc">Description:</label> <textarea name="desc" id="desc"></textarea></div><div><button value="cancel" formmethod="dialog">Cancel</button> <button id="confirmBtn" value="default">Confirm</button></div></form></dialog><div class="sidebar"><div class="logo"><img src="c99399809d60f3a208e3.png" alt="Todo List Logo"><h1>My<br>Todo</h1></div><div class="links"><button>Home</button> <button>About us</button> <button>Profile</button> <button>Configuration</button></div><div class="filters"><button type="button" id="new-todo">New ToDo</button> <button type="button" id="filter-all">All</button> <button type="button" id="filter-high">Priority High</button> <button type="button" id="filter-medium">Priority Medium</button> <button type="button" id="filter-low">Priority Low</button></div></div><main><dialog id="todo-expanded"><h2 class="todo-title"></h2><p class="todo-project"></p><p class="todo-date"></p><p class="todo-priority"></p><p class="todo-desc"></p><form method="dialog" autocomplete="off"><div><label for="notes">Notes:</label> <textarea name="notes" id="notes"></textarea></div><div><button type="button">Add checkbox</button><ul class="checkbox-list"></ul></div><div><button id="deleteBtn" value="delete" formmethod="dialog">Delete</button> <button id="cancelBtn" value="cancel" formmethod="dialog">Cancel</button> <button id="saveBtn" value="save">Save</button></div></form></dialog></main></body></html>
